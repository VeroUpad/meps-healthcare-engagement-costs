# Streamlit theme for the MEPS dashboard (streamlit_app.py).
# Matches the chart palette: dark teal #264653 from the example "handover" dashboard.
# Delete this file to go back to Streamlit's default red accent color.
# Viewers can still switch between light and dark in the app menu (⋮ -> Settings).

[theme.light]
primaryColor = "#264653"   # dark teal: buttons, sliders, toggles, selected tabs

[theme.dark]
primaryColor = "#6FB0C0"   # lighter teal that stays readable on a dark background
